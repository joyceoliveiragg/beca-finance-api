spring.application.name=ms-processor

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/db_transacoes
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=transaction-processor-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

topic.transaction.requested=transaction.requested
topic.transaction.dlq=transaction.dlq

api.brasil.url=https://brasilapi.com.br/api

api.mock.url=http://mock-api:3000

logging.level.org.springframework.kafka=INFO
logging.level.br.com.beca.ms_processor=DEBUG